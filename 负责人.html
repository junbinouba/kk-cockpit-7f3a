:root{--bg:#0d1117;--panel:#161b22;--line:#232a33;--text:#e6edf3;--muted:#8b949e}

body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin:14px 0}

button{background:#2a1a0e;color:#f0883e;border:1px solid #f0883e;border-radius:8px;padding:7px 14px;font-size:13px;cursor:pointer}

table{width:100%;border-collapse:collapse;font-size:13px}

th{color:var(--muted);font-weight:500}
.num{text-align:right;font-variant-numeric:tabular-nums}
.note{color:var(--muted);font-size:12px;margin-top:8px}
.bar{display:grid;grid-template-columns:110px 1fr 90px;gap:8px;align-items:center;padding:4px 0}

.bar .track{background:#0b0f14;border-radius:5px;height:16px;overflow:hidden}
.bar .fill{height:100%;background:#3b82f6;border-radius:5px}
.bar .bv{text-align:right;font-size:12px;font-variant-numeric:tabular-nums;color:#c9d1d9}
.tablewrap{max-height:560px;overflow:auto}
footer{margin-top:28px;color:#6e7681;font-size:12px;border-top:1px solid #232a33;padding-top:10px}
#tip{position:fixed;display:none;z-index:99;background:#0b0f14;color:#e6edf3;border:1px solid #f0883e;border-radius:6px;padding:5px 9px;font-size:12px;pointer-events:none;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.5)}
